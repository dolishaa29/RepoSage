name: gitAudit tests
on:
  push:
    branches: ["gitaudit/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          for f in $(find . -name requirements.txt -not -path "*/node_modules/*"); do pip install -r "$f" || true; done
          pip install pytest
      - run: python -m pytest tests/gitaudit -q
